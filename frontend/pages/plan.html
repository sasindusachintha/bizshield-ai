<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>/* apply stored theme early to avoid FOUC */(function(){try{var t=localStorage.getItem('BizShield-theme');if(t==='dark'||t==='light'){document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;}}catch(e){} })();</script>
  <style>/* critical background to prevent white flash before CSS loads */
    html[data-theme="dark"]{background:#101923;color-scheme:dark}
    html[data-theme="light"]{background:#edf4ef;color-scheme:light}
  </style>
  <title>BizShield – Build a Plan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js" defer></script>

  <style>
    /* ═══════════════════════════════════════════════
       PLAN PAGE — 3D ANIMATION LAYER
       Theme: Journey / Roadmap — flowing path forward
    ═══════════════════════════════════════════════ */

    /* ── Scroll progress ── */
    .scroll-progress {
      position: fixed; top: 0; left: 0; height: 3px;
      background: linear-gradient(90deg, #16a34a, #4ade80);
      z-index: 9997; width: 0%;
      box-shadow: 0 0 8px rgba(74,222,128,0.7);
      transition: width 0.1s linear;
    }

    /* ── Three.js journey background ── */
    #bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none; width: 100%; height: 100%;
    }

    /* ── Ambient orbs (green tones) ── */
    .bg-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg-orb  { position: absolute; border-radius: 50%; filter: blur(90px); }
    .bg-orb-1 { width:500px;height:500px; background:radial-gradient(circle,rgba(22,163,74,1),transparent 70%);  top:-180px;left:-100px;  opacity:.05; animation:orbDrift 26s ease-in-out infinite; }
    .bg-orb-2 { width:380px;height:380px; background:radial-gradient(circle,rgba(74,222,128,1),transparent 70%); bottom:5%;right:-120px; opacity:.04; animation:orbDrift 20s ease-in-out infinite reverse 6s; }
    .bg-orb-3 { width:320px;height:320px; background:radial-gradient(circle,rgba(15,118,110,1),transparent 70%); top:38%;left:4%;      opacity:.035;animation:orbDrift 24s ease-in-out infinite 9s; }
    @keyframes orbDrift {
      0%,100% { transform:translate(0,0) scale(1); }
      33%      { transform:translate(36px,-28px) scale(1.09); }
      66%      { transform:translate(-30px,42px)  scale(0.93); }
    }

    /* Everything above bg */
    .container, nav { position: relative; z-index: 2; }

    /* ── Navbar entrance ── */
    .navbar-brand { animation: brandPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.1s both; }
    @keyframes brandPop {
      from { opacity:0; transform:perspective(400px) translateZ(-30px) scale(0.85); }
      to   { opacity:1; transform:none; }
    }
    .navbar-nav .nav-item { animation: navDrop 0.45s cubic-bezier(0.16,1,0.3,1) both; }
    .navbar-nav .nav-item:nth-child(1){animation-delay:.18s}
    .navbar-nav .nav-item:nth-child(2){animation-delay:.24s}
    .navbar-nav .nav-item:nth-child(3){animation-delay:.30s}
    .navbar-nav .nav-item:nth-child(4){animation-delay:.36s}
    .navbar-nav .nav-item:nth-child(5){animation-delay:.42s}
    @keyframes navDrop {
      from { opacity:0; transform:translateY(-10px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── Page header 3D entrance ── */
    .page-header { animation: headerDive 0.75s cubic-bezier(0.16,1,0.3,1) 0.15s both; }
    @keyframes headerDive {
      from { opacity:0; transform:perspective(800px) translateZ(-60px) translateY(22px) rotateX(-14deg); filter:blur(4px); }
      to   { opacity:1; transform:none; filter:blur(0); }
    }
    .page-header h2 span {
      display: inline-block;
      animation: iconSpin3D 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
    }
    @keyframes iconSpin3D {
      from { transform:perspective(300px) rotateY(-180deg) scale(0.4); opacity:0; }
      to   { transform:none; opacity:1; }
    }

    /* ── Input card entrance ── */
    .input-card {
      animation: cardSlideIn 0.65s cubic-bezier(0.16,1,0.3,1) 0.28s both;
      position: relative; overflow: hidden;
    }
    .input-card::before {
      content:''; position:absolute; top:0; left:-100%; width:60%; height:100%;
      background:linear-gradient(90deg,transparent,rgba(74,222,128,0.05),transparent);
      transform:skewX(-20deg); animation:inputShimmer 3s ease 1s 1 forwards;
    }
    @keyframes inputShimmer { to { left:160%; } }
    @keyframes cardSlideIn {
      from { opacity:0; transform:perspective(700px) translateY(30px) rotateX(-10deg) scale(0.97); }
      to   { opacity:1; transform:none; }
    }

    /* ── Textarea focus glow ── */
    #input-idea { transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease; }
    #input-idea:focus {
      border-color: #4ade80 !important;
      box-shadow: 0 0 0 3px rgba(74,222,128,0.15), 0 0 20px rgba(74,222,128,0.1) !important;
      transform: perspective(600px) translateZ(4px);
    }

    /* ── Submit button ── */
    #btn-submit {
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
      position: relative; overflow: hidden;
    }
    #btn-submit::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,0.14),transparent);
      background-size:200% 100%; transform:translateX(-100%);
      transition:transform 0.4s ease;
    }
    #btn-submit:hover:not(:disabled)::after { transform:translateX(100%); }
    #btn-submit:hover:not(:disabled) {
      transform:perspective(400px) translateZ(8px) scale(1.04);
      box-shadow:0 12px 30px rgba(74,222,128,0.3);
    }
    #btn-submit:active { transform:scale(0.97); }

    /* ── Board content reveal ── */
    .result-reveal { animation: resultIn 0.65s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes resultIn {
      from { opacity:0; transform:perspective(700px) translateY(24px) rotateX(-8deg); }
      to   { opacity:1; transform:none; }
    }

    /* ── Top-level result cards (setup, 7-day, 30-day, tips) ── */
    #board-content > .card:nth-child(2)  { animation: cardIn3D 0.6s cubic-bezier(0.16,1,0.3,1) 0.10s both; }
    #board-content > .card:nth-child(3)  { animation: cardIn3D 0.6s cubic-bezier(0.16,1,0.3,1) 0.20s both; }
    #board-content > .card:nth-child(4)  { animation: cardIn3D 0.6s cubic-bezier(0.16,1,0.3,1) 0.30s both; }
    #board-content > .card:nth-child(5)  { animation: cardIn3D 0.6s cubic-bezier(0.16,1,0.3,1) 0.40s both; }
    @keyframes cardIn3D {
      from { opacity:0; transform:perspective(600px) translateY(24px) rotateX(-10deg) scale(0.96); }
      to   { opacity:1; transform:none; }
    }

    /* ── Setup step circles 3D flip ── */
    .step-circle {
      display:inline-flex; align-items:center; justify-content:center;
      width:36px; height:36px; border-radius:50%;
      background:var(--success, #16a34a); color:white; font-weight:700; flex-shrink:0;
      animation: circlePop 0.55s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes circlePop {
      from { transform:perspective(300px) rotateY(-180deg) scale(0.3); opacity:0; }
      to   { transform:none; opacity:1; }
    }

    /* ── Setup step items stagger ── */
    #board-content .col-md-6:nth-child(1) .d-flex { animation: stepIn 0.5s ease 0.12s both; }
    #board-content .col-md-6:nth-child(2) .d-flex { animation: stepIn 0.5s ease 0.21s both; }
    #board-content .col-md-6:nth-child(3) .d-flex { animation: stepIn 0.5s ease 0.30s both; }
    #board-content .col-md-6:nth-child(4) .d-flex { animation: stepIn 0.5s ease 0.39s both; }
    #board-content .col-md-6:nth-child(5) .d-flex { animation: stepIn 0.5s ease 0.48s both; }
    @keyframes stepIn {
      from { opacity:0; transform:translateX(-18px); }
      to   { opacity:1; transform:translateX(0); }
    }

    /* ── 7-day blocks alternate slide ── */
    .sprint-block { animation: sprintIn 0.5s cubic-bezier(0.16,1,0.3,1) both; }
    .sprint-block:nth-child(odd)  { animation-name: sprintInLeft; }
    .sprint-block:nth-child(even) { animation-name: sprintInRight; }
    .sprint-block:nth-child(1){animation-delay:.10s} .sprint-block:nth-child(2){animation-delay:.18s}
    .sprint-block:nth-child(3){animation-delay:.26s} .sprint-block:nth-child(4){animation-delay:.34s}
    @keyframes sprintInLeft  { from{opacity:0;transform:translateX(-22px) perspective(500px) rotateY(8deg)} to{opacity:1;transform:none} }
    @keyframes sprintInRight { from{opacity:0;transform:translateX( 22px) perspective(500px) rotateY(-8deg)} to{opacity:1;transform:none} }

    /* ── Day badge pop ── */
    .badge { animation: badgePop 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }
    @keyframes badgePop {
      from { transform:scale(0.4); opacity:0; }
      to   { transform:scale(1);   opacity:1; }
    }

    /* ── 30-day milestone cards bounce up ── */
    .milestone-block { animation: milestoneBounce 0.55s cubic-bezier(0.34,1.56,0.64,1) both; }
    .milestone-block:nth-child(1){animation-delay:.08s} .milestone-block:nth-child(2){animation-delay:.16s}
    .milestone-block:nth-child(3){animation-delay:.24s} .milestone-block:nth-child(4){animation-delay:.32s}
    @keyframes milestoneBounce {
      from { opacity:0; transform:perspective(500px) translateY(30px) rotateX(-14deg) scale(0.93); }
      to   { opacity:1; transform:none; }
    }

    /* ── Success tips cascade ── */
    .tip-block { animation: tipSlide 0.45s cubic-bezier(0.16,1,0.3,1) both; }
    .tip-block:nth-child(1){animation-delay:.12s} .tip-block:nth-child(2){animation-delay:.20s}
    .tip-block:nth-child(3){animation-delay:.28s} .tip-block:nth-child(4){animation-delay:.36s}
    .tip-block:nth-child(5){animation-delay:.44s} .tip-block:nth-child(6){animation-delay:.52s}
    @keyframes tipSlide {
      from { opacity:0; transform:translateY(14px) scale(0.95); }
      to   { opacity:1; transform:none; }
    }

    /* ── Task list items ── */
    #board-content .list-unstyled li {
      animation: liSlide 0.35s ease both;
    }
    #board-content .list-unstyled li:nth-child(1){animation-delay:.30s}
    #board-content .list-unstyled li:nth-child(2){animation-delay:.38s}
    #board-content .list-unstyled li:nth-child(3){animation-delay:.46s}
    #board-content .list-unstyled li:nth-child(4){animation-delay:.54s}
    @keyframes liSlide {
      from { opacity:0; transform:translateX(-12px); }
      to   { opacity:1; transform:translateX(0); }
    }

    /* ── h5 result heading scanline ── */
    #board-content h5 { position:relative; animation:resultIn 0.5s ease both; }
    #board-content h5::after {
      content:''; position:absolute; bottom:-4px; left:0;
      height:2px; width:0;
      background:linear-gradient(90deg,#4ade80,transparent);
      animation:scanLine 0.8s ease 0.4s forwards;
    }
    @keyframes scanLine { to { width:100%; } }

    /* ── Alert ── */
    #board-content .alert { animation: alertUp 0.5s cubic-bezier(0.16,1,0.3,1) 0.5s both; }
    @keyframes alertUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── Card hover tilt ── */
    #board-content .card { transition:transform 0.15s ease, box-shadow 0.15s ease; will-change:transform; }

    /* ── Particle burst ── */
    .burst-particle {
      position:fixed; width:5px; height:5px; border-radius:50%;
      pointer-events:none; z-index:9990;
      animation:burst 0.65s ease-out forwards;
    }
    @keyframes burst {
      to { transform:translate(var(--tx),var(--ty)) scale(0); opacity:0; }
    }

    /* ── Waypoint ping on step circles ── */
    @keyframes waypointPing {
      0%   { box-shadow:0 0 0 0 rgba(74,222,128,0.6); }
      70%  { box-shadow:0 0 0 12px rgba(74,222,128,0); }
      100% { box-shadow:0 0 0 0 rgba(74,222,128,0); }
    }
    .step-circle { animation: circlePop 0.55s cubic-bezier(0.34,1.56,0.64,1) both, waypointPing 2.2s ease 0.8s infinite; }
  </style>
</head>

  <canvas id="bg-canvas"></canvas>
  <div class="bg-orbs" aria-hidden="true">
    <div class="bg-orb bg-orb-1"></div>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary px-3 py-2">

  <div class="container py-4">

    <div class="mb-4 page-header">
      <h2 class="fw-bold"><span><i class="fas fa-map text-success me-2"></i></span>Build a Launch Plan</h2>
      <p class="text-muted">Enter your business idea to get setup steps, a 7-day sprint, and a 30-day milestone roadmap.</p>
    </div>

    <div class="card bg-dark border-secondary mb-4 input-card">
      <div class="card-body p-4">
        <label class="form-label fw-semibold">Business Idea <span class="text-danger">*</span></label>
        <textarea id="input-idea" class="form-control bg-dark text-light border-secondary" rows="3"
          placeholder="e.g. Online tutoring platform for high school maths students..."></textarea>
        <div class="mt-3">
          <button id="btn-submit" class="btn btn-success px-4 fw-semibold">
            <i class="fas fa-road me-2"></i>Generate Plan
          </button>
        </div>
      </div>
    </div>

    <div id="board-content"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/plan.js"></script>

  <script>
    /* ─ Scroll progress ─ */
    window.addEventListener('scroll', () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      document.getElementById('scroll-progress').style.width = (max > 0 ? window.scrollY / max * 100 : 0) + '%';
    });

    /* ─ Three.js: forward-flowing path particles (journey metaphor) ─ */
    (function () {
      const canvas = document.getElementById('bg-canvas');
      if (!canvas || typeof THREE === 'undefined') return;
      const W = window.innerWidth, H = window.innerHeight;
      const scene    = new THREE.Scene();
      const camera   = new THREE.PerspectiveCamera(60, W / H, 0.1, 1000);
      camera.position.set(0, 0, 16);
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
      renderer.setSize(W, H);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));

      /* Road-like grid lines (horizontal) */
      const lineMat = new THREE.LineBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.035 });
      [-8, -4, 0, 4, 8].forEach(y => {
        const pts = [];
        for (let x = -20; x <= 20; x += 0.5) pts.push(new THREE.Vector3(x, y, 0));
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        scene.add(new THREE.Line(geo, lineMat));
      });

      /* Dashed centre lane */
      const dashMat = new THREE.LineBasicMaterial({ color: 0x16a34a, transparent: true, opacity: 0.05 });
      const dashPts = [];
      for (let x = -20; x <= 20; x += 1.2) {
        dashPts.push(new THREE.Vector3(x, 0, 0));
        dashPts.push(new THREE.Vector3(x + 0.55, 0, 0));
      }
      scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(dashPts), dashMat));

      /* Flowing waypoint particles */
      const COUNT = 90;
      const pos   = new Float32Array(COUNT * 3);
      const vel   = new Float32Array(COUNT);
      for (let i = 0; i < COUNT; i++) {
        pos[i * 3]     = (Math.random() - 0.5) * 38;
        pos[i * 3 + 1] = (Math.random() - 0.5) * 22;
        pos[i * 3 + 2] = (Math.random() - 0.5) * 10 - 5;
        vel[i]         = 0.015 + Math.random() * 0.025;
      }
      const ptGeo = new THREE.BufferGeometry();
      ptGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const ptMesh = new THREE.Points(ptGeo,
        new THREE.PointsMaterial({ color: 0x4ade80, size: 0.06, transparent: true, opacity: 0.45 })
      );
      scene.add(ptMesh);

      /* Winding path curve */
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-18, -3, 0), new THREE.Vector3(-10, 4, 0),
        new THREE.Vector3(0, -2, 0),   new THREE.Vector3(10, 5, 0),
        new THREE.Vector3(18, 0, 0)
      ]);
      const curvePts = curve.getPoints(80);
      const curveLine = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(curvePts),
        new THREE.LineBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.055 })
      );
      scene.add(curveLine);

      /* Glowing milestone orbs along the curve */
      [0.1, 0.3, 0.55, 0.75, 0.95].forEach(t => {
        const p = curve.getPoint(t);
        const orb = new THREE.Mesh(
          new THREE.SphereGeometry(0.14, 6, 6),
          new THREE.MeshBasicMaterial({ color: 0x4ade80, transparent: true, opacity: 0.28 })
        );
        orb.position.copy(p);
        scene.add(orb);
      });

      let t = 0, mx = 0, my = 0, sx = 0, sy = 0;
      document.addEventListener('mousemove', e => {
        mx = (e.clientX / W - 0.5) * 0.16;
        my = (e.clientY / H - 0.5) * -0.10;
      });

      const posArr = ptGeo.attributes.position.array;

      (function tick() {
        requestAnimationFrame(tick); t += 0.016;

        /* Move particles rightward (journey forward) */
        for (let i = 0; i < COUNT; i++) {
          posArr[i * 3] += vel[i];
          if (posArr[i * 3] > 19) posArr[i * 3] = -19;
        }
        ptGeo.attributes.position.needsUpdate = true;

        /* Gentle camera drift */
        sx += (mx - sx) * 0.04; sy += (my - sy) * 0.04;
        scene.rotation.y = sx; scene.rotation.x = sy;

        renderer.render(scene, camera);
      })();

      window.addEventListener('resize', () => {
        const nw = window.innerWidth, nh = window.innerHeight;
        camera.aspect = nw / nh; camera.updateProjectionMatrix();
        renderer.setSize(nw, nh);
      });
    })();

    /* ─ Board content observer ─ */
    const boardObs = new MutationObserver(() => {
      const board = document.getElementById('board-content');
      if (!board || board.querySelector('.spinner-border')) return;

      /* Wrap step circles so CSS animation applies */
      board.querySelectorAll('.rounded-circle[style*="36px"]').forEach(el => {
        el.classList.add('step-circle');
      });

      /* Add semantic classes for sprint / milestone / tip blocks */
      board.querySelectorAll('.col-md-6 .p-3.border.rounded.h-100').forEach(el => {
        el.closest('.col-md-6')?.classList.add('sprint-block');
      });
      board.querySelectorAll('.col-md-6.col-lg-3').forEach(el => {
        el.classList.add('milestone-block');
      });
      board.querySelectorAll('.col-md-4 .d-flex.gap-2.p-2').forEach(el => {
        el.closest('.col-md-4')?.classList.add('tip-block');
      });

      /* Card hover tilt */
      board.querySelectorAll('.card').forEach(card => {
        card.addEventListener('mousemove', e => {
          const r = card.getBoundingClientRect();
          const x = (e.clientX - r.left) / r.width  - 0.5;
          const y = (e.clientY - r.top)  / r.height - 0.5;
          card.style.transform   = `perspective(700px) rotateX(${-y * 7}deg) rotateY(${x * 7}deg) translateZ(7px)`;
          card.style.boxShadow   = `${-x * 18}px ${-y * 18}px 40px rgba(74,222,128,0.11)`;
        });
        card.addEventListener('mouseleave', () => {
          card.style.transform = ''; card.style.boxShadow = '';
        });
      });

      /* Particle burst on result arrival */
      const btn = document.getElementById('btn-submit');
      if (btn) {
        const r = btn.getBoundingClientRect();
        spawnBurst(r.left + r.width / 2, r.top + r.height / 2,
          ['#4ade80', '#16a34a', '#0f766e', '#f59e0b']);
      }
    });
    boardObs.observe(document.getElementById('board-content'), { childList: true });

    function spawnBurst(cx, cy, colors) {
      for (let i = 0; i < 14; i++) {
        const p = document.createElement('div');
        p.className = 'burst-particle';
        const angle = (i / 14) * Math.PI * 2;
        const dist  = 50 + Math.random() * 45;
        p.style.cssText = `left:${cx}px;top:${cy}px;background:${colors[i % colors.length]}`;
        p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        document.body.appendChild(p);
        p.addEventListener('animationend', () => p.remove());
      }
    }

    /* ─ Button sparkle on click ─ */
    document.getElementById('btn-submit')?.addEventListener('click', function () {
      const r = this.getBoundingClientRect();
      spawnBurst(r.left + r.width / 2, r.top + r.height / 2,
        ['#4ade80', '#16a34a', '#ffffff', '#f59e0b']);
    });
  </script>
</body>
</html>
