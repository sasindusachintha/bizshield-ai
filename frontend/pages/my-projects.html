<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizShield AI - My Projects</title>
  <style id="theme-preload">
    html { color-scheme: dark; background: #101923; }
    body { margin: 0; background: #101923; color: #f4fbfa; }
  </style>
  <script>
    (function () {
      try {
        const storedTheme = localStorage.getItem('bizshieldai-theme');
        const theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (_) {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.style.colorScheme = 'dark';
      }
    })();
  </script>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,500,600,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="../js/theme.js" defer></script>
  <style>
    nav, .navbar { position: relative; z-index: 1030; }
    .container { position: relative; z-index: 2; }
  </style>
</head>
<body class="bg-dark text-light min-vh-100">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary px-3 py-2">
    <a class="navbar-brand fw-bold fs-5" href="../index.html"><i class="fas fa-shield-halved me-1"></i>BizShield AI</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto gap-1 align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active fw-semibold" href="my-projects.html"><i class="fas fa-folder-open me-1"></i>My Projects</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" id="toolsDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fas fa-toolbox me-1"></i>Tools
          </a>
          <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end" aria-labelledby="toolsDropdown">
            <li><a class="dropdown-item" href="ideas.html"><i class="fas fa-lightbulb me-2"></i>Ideas</a></li>
            <li><a class="dropdown-item" href="analysis.html"><i class="fas fa-chart-bar me-2"></i>Analysis</a></li>
            <li><a class="dropdown-item" href="plan.html"><i class="fas fa-map me-2"></i>Plan</a></li>
            <li><a class="dropdown-item" href="marketing.html"><i class="fas fa-bullhorn me-2"></i>Marketing</a></li>
          </ul>
        </li>
        <li class="nav-item"><a class="nav-link" href="crisis.html"><i class="fas fa-triangle-exclamation me-1"></i>Crisis Mode</a></li>
        <li class="nav-item"><a class="nav-link" href="settings.html"><i class="fas fa-gear me-1"></i>Settings</a></li>
        <li class="nav-item d-none"><a class="nav-link" href="login.html"><i class="fas fa-right-to-bracket me-1"></i>Login</a></li>
        <li class="nav-item d-none"><a class="nav-link" href="register.html"><i class="fas fa-user-plus me-1"></i>Register</a></li>
      </ul>
    </div>
  </nav>

  <div class="container py-4">
    <div class="mb-4 page-header d-flex flex-wrap justify-content-between align-items-end gap-3">
      <div>
        <h2 class="fw-bold"><i class="fas fa-folder-open text-warning me-2"></i>My Projects</h2>
        <p class="text-muted mb-0">Every business idea you've saved, along with the AI-generated documents attached to it.</p>
      </div>
      <button type="button" id="btn-new-project" class="btn btn-outline-success">
        <i class="fas fa-plus me-1"></i>New Project
      </button>
    </div>

    <div id="projects-root"></div>
  </div>

  <!-- New Project Modal -->
  <div class="modal fade" id="newProjectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content bg-dark border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title fw-bold"><i class="fas fa-folder-plus text-success me-2"></i>New Project</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">Project Title <span class="text-danger">*</span></label>
            <input type="text" id="new-project-title" class="form-control bg-dark text-light border-secondary" maxlength="140" placeholder="e.g. EcoPack Subscription Boxes">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Industry</label>
            <input type="text" id="new-project-industry" class="form-control bg-dark text-light border-secondary" maxlength="80" placeholder="e.g. E-commerce, Food & Beverage">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Stage</label>
            <select id="new-project-stage" class="form-select bg-dark text-light border-secondary">
              <option value="ideation" selected>Ideation</option>
              <option value="validation">Validation</option>
              <option value="mvp">MVP</option>
              <option value="growth">Growth</option>
              <option value="scaling">Scaling</option>
            </select>
          </div>
          <div class="mb-1">
            <label class="form-label fw-semibold">Description</label>
            <textarea id="new-project-description" class="form-control bg-dark text-light border-secondary" rows="3" maxlength="3000" placeholder="Briefly describe this business idea..."></textarea>
          </div>
          <div id="new-project-error" class="text-danger small mt-2 d-none"></div>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="btn-create-project" class="btn btn-success">
            <i class="fas fa-check me-1"></i>Create Project
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/prefs.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/my-projects.js"></script>
</body>
</html>
