<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>/* apply stored theme early to avoid FOUC */(function(){try{var t=localStorage.getItem('BizShield-theme');if(t==='dark'||t==='light'){document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;}}catch(e){} })();</script>
  <style>/* critical background to prevent white flash before CSS loads */
    html[data-theme="dark"]{background:#101923;color-scheme:dark}
    html[data-theme="light"]{background:#edf4ef;color-scheme:light}
  </style>
  <title>BizShield – Marketing Kit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js" defer></script>

  <style>
    /* ═══════════════════════════════════════════════
       MARKETING PAGE — 3D ANIMATION LAYER
       Theme: Broadcast signal — expanding rings & waves
    ═══════════════════════════════════════════════ */

    /* ── Scroll progress ── */
    .scroll-progress {
      position: fixed; top: 0; left: 0; height: 3px;
      background: linear-gradient(90deg, #f97316, #dc2626);
      z-index: 9997; width: 0%;
      box-shadow: 0 0 8px rgba(249,115,22,0.7);
      transition: width 0.1s linear;
    }

    /* ── Three.js broadcast background ── */
    #bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none; width: 100%; height: 100%;
    }

    /* ── Ambient orbs (warm broadcast tones) ── */
    .bg-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg-orb  { position: absolute; border-radius: 50%; filter: blur(90px); }
    .bg-orb-1 { width:520px;height:520px; background:radial-gradient(circle,rgba(220,38,38,1),transparent 70%);  top:-160px;right:-120px; opacity:.05;  animation:orbDrift 24s ease-in-out infinite; }
    .bg-orb-2 { width:380px;height:380px; background:radial-gradient(circle,rgba(249,115,22,1),transparent 70%); bottom:8%;left:-100px;   opacity:.045; animation:orbDrift 19s ease-in-out infinite reverse 4s; }
    .bg-orb-3 { width:300px;height:300px; background:radial-gradient(circle,rgba(244,63,94,1),transparent 70%);  top:42%;right:6%;       opacity:.038; animation:orbDrift 22s ease-in-out infinite 7s; }
    @keyframes orbDrift {
      0%,100% { transform:translate(0,0) scale(1); }
      33%      { transform:translate(38px,-32px) scale(1.08); }
      66%      { transform:translate(-30px,40px)  scale(0.93); }
    }

    .container, nav { position: relative; z-index: 2; }

    /* ── Navbar entrance ── */
    .navbar-brand { animation: brandPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.1s both; }
    @keyframes brandPop {
      from { opacity:0; transform:perspective(400px) translateZ(-30px) scale(0.85); }
      to   { opacity:1; transform:none; }
    }
    .navbar-nav .nav-item { animation: navDrop 0.45s cubic-bezier(0.16,1,0.3,1) both; }
    .navbar-nav .nav-item:nth-child(1){animation-delay:.18s}
    .navbar-nav .nav-item:nth-child(2){animation-delay:.24s}
    .navbar-nav .nav-item:nth-child(3){animation-delay:.30s}
    .navbar-nav .nav-item:nth-child(4){animation-delay:.36s}
    .navbar-nav .nav-item:nth-child(5){animation-delay:.42s}
    @keyframes navDrop {
      from { opacity:0; transform:translateY(-10px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── Page header 3D entrance ── */
    .page-header { animation: headerDive 0.75s cubic-bezier(0.16,1,0.3,1) 0.15s both; }
    @keyframes headerDive {
      from { opacity:0; transform:perspective(800px) translateZ(-60px) translateY(22px) rotateX(-14deg); filter:blur(4px); }
      to   { opacity:1; transform:none; filter:blur(0); }
    }
    .page-header h2 span {
      display: inline-block;
      animation: iconSpin3D 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
    }
    @keyframes iconSpin3D {
      from { transform:perspective(300px) rotateY(-180deg) scale(0.4); opacity:0; }
      to   { transform:none; opacity:1; }
    }

    /* ── Input card entrance ── */
    .input-card {
      animation: cardSlideIn 0.65s cubic-bezier(0.16,1,0.3,1) 0.28s both;
      position: relative; overflow: hidden;
    }
    .input-card::before {
      content:''; position:absolute; top:0; left:-100%; width:60%; height:100%;
      background:linear-gradient(90deg,transparent,rgba(249,115,22,0.05),transparent);
      transform:skewX(-20deg); animation:inputShimmer 3s ease 1s 1 forwards;
    }
    @keyframes inputShimmer { to { left:160%; } }
    @keyframes cardSlideIn {
      from { opacity:0; transform:perspective(700px) translateY(30px) rotateX(-10deg) scale(0.97); }
      to   { opacity:1; transform:none; }
    }

    /* ── Textarea focus glow ── */
    #input-idea { transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease; }
    #input-idea:focus {
      border-color: #f97316 !important;
      box-shadow: 0 0 0 3px rgba(249,115,22,0.15), 0 0 20px rgba(249,115,22,0.1) !important;
      transform: perspective(600px) translateZ(4px);
    }

    /* ── Submit button ── */
    #btn-submit {
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
      position: relative; overflow: hidden;
    }
    #btn-submit::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,0.16),transparent);
      background-size:200% 100%; transform:translateX(-100%);
      transition:transform 0.4s ease;
    }
    #btn-submit:hover:not(:disabled)::after { transform:translateX(100%); }
    #btn-submit:hover:not(:disabled) {
      transform:perspective(400px) translateZ(8px) scale(1.04);
      box-shadow:0 12px 30px rgba(249,115,22,0.32);
    }
    #btn-submit:active { transform:scale(0.97); }

    /* ── Board content reveal ── */
    @keyframes resultIn {
      from { opacity:0; transform:perspective(700px) translateY(24px) rotateX(-8deg); }
      to   { opacity:1; transform:none; }
    }

    /* ── Section card stagger (IG, Ads, Slogans, Social) ── */
    #board-content > .row > .col-md-6:nth-child(1) .card { animation: cardFlipIn 0.6s cubic-bezier(0.16,1,0.3,1) 0.06s both; }
    #board-content > .row > .col-md-6:nth-child(2) .card { animation: cardFlipIn 0.6s cubic-bezier(0.16,1,0.3,1) 0.16s both; }
    #board-content > .row > .col-12:nth-child(3)   .card { animation: cardIn3D   0.6s cubic-bezier(0.16,1,0.3,1) 0.26s both; }
    #board-content > .row > .col-12:nth-child(4)   .card { animation: cardIn3D   0.6s cubic-bezier(0.16,1,0.3,1) 0.36s both; }
    @keyframes cardFlipIn {
      from { opacity:0; transform:perspective(700px) rotateY(-18deg) translateX(-20px) scale(0.94); }
      to   { opacity:1; transform:none; }
    }
    @keyframes cardIn3D {
      from { opacity:0; transform:perspective(600px) translateY(24px) rotateX(-10deg) scale(0.96); }
      to   { opacity:1; transform:none; }
    }

    /* ── Instagram post items slide left ── */
    .post-item { animation: postSlide 0.5s cubic-bezier(0.16,1,0.3,1) both; }
    .post-item:nth-child(1){animation-delay:.18s} .post-item:nth-child(2){animation-delay:.28s}
    @keyframes postSlide {
      from { opacity:0; transform:translateX(-20px) perspective(400px) rotateY(6deg); }
      to   { opacity:1; transform:none; }
    }

    /* ── Ad copy items slide right ── */
    .ad-item { animation: adSlide 0.5s cubic-bezier(0.16,1,0.3,1) both; }
    .ad-item:nth-child(1){animation-delay:.18s} .ad-item:nth-child(2){animation-delay:.28s}
    @keyframes adSlide {
      from { opacity:0; transform:translateX(20px) perspective(400px) rotateY(-6deg); }
      to   { opacity:1; transform:none; }
    }

    /* ── Slogan items pop bounce ── */
    .slogan-item { animation: sloganBounce 0.5s cubic-bezier(0.34,1.56,0.64,1) both; }
    .slogan-item:nth-child(1){animation-delay:.28s} .slogan-item:nth-child(2){animation-delay:.36s} .slogan-item:nth-child(3){animation-delay:.44s}
    @keyframes sloganBounce {
      from { opacity:0; transform:perspective(400px) translateZ(-20px) scale(0.85); }
      to   { opacity:1; transform:none; }
    }

    /* ── Social caption cards 3D flip ── */
    .social-card-wrap { animation: socialFlip 0.55s cubic-bezier(0.34,1.56,0.64,1) both; }
    .social-card-wrap:nth-child(1){animation-delay:.34s} .social-card-wrap:nth-child(2){animation-delay:.44s} .social-card-wrap:nth-child(3){animation-delay:.54s}
    @keyframes socialFlip {
      from { opacity:0; transform:perspective(600px) rotateX(20deg) translateY(16px) scale(0.9); }
      to   { opacity:1; transform:none; }
    }

    /* ── Badge pop ── */
    .badge { animation: badgePop 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }
    @keyframes badgePop {
      from { transform:scale(0.4); opacity:0; }
      to   { transform:scale(1);   opacity:1; }
    }

    /* ── h5 result heading scanline (orange) ── */
    #board-content h5 { position:relative; animation:resultIn 0.5s ease both; }
    #board-content h5::after {
      content:''; position:absolute; bottom:-4px; left:0;
      height:2px; width:0;
      background:linear-gradient(90deg,#f97316,transparent);
      animation:scanLine 0.8s ease 0.4s forwards;
    }
    @keyframes scanLine { to { width:100%; } }

    /* ── Alert ── */
    #board-content .alert { animation: alertUp 0.5s cubic-bezier(0.16,1,0.3,1) 0.5s both; }
    @keyframes alertUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── Card hover tilt ── */
    #board-content .card { transition:transform 0.15s ease, box-shadow 0.15s ease; will-change:transform; }

    /* ── Copy button ripple ── */
    .btn-outline-secondary {
      position: relative; overflow: hidden;
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), color 0.2s, background 0.2s;
    }
    .btn-outline-secondary:hover { transform: scale(1.12); }
    .copy-ripple {
      position:absolute; width:6px; height:6px; border-radius:50%;
      background:rgba(249,115,22,0.5); transform:scale(0);
      animation:rippleOut 0.4s ease-out forwards; pointer-events:none;
    }
    @keyframes rippleOut {
      to { transform:scale(10); opacity:0; }
    }

    /* ── Particle burst ── */
    .burst-particle {
      position:fixed; width:5px; height:5px; border-radius:50%;
      pointer-events:none; z-index:9990;
      animation:burst 0.65s ease-out forwards;
    }
    @keyframes burst {
      to { transform:translate(var(--tx),var(--ty)) scale(0); opacity:0; }
    }

    /* ── Broadcast ping on social icons ── */
    @keyframes broadcastPing {
      0%   { box-shadow:0 0 0 0 rgba(249,115,22,0.5); }
      70%  { box-shadow:0 0 0 14px rgba(249,115,22,0); }
      100% { box-shadow:0 0 0 0 rgba(249,115,22,0); }
    }
    #board-content .fab.fa-instagram { animation: broadcastPing 2.4s ease 0.8s infinite; border-radius:50%; }
  </style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/marketing.js"></script>

  <script>
    /* ─ Scroll progress ─ */
    window.addEventListener('scroll', () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      document.getElementById('scroll-progress').style.width = (max > 0 ? window.scrollY / max * 100 : 0) + '%';
    });

    /* ─ Three.js: broadcast signal — expanding rings + floating signal dots ─ */
    (function () {
      const canvas = document.getElementById('bg-canvas');
      if (!canvas || typeof THREE === 'undefined') return;
      const W = window.innerWidth, H = window.innerHeight;
      const scene    = new THREE.Scene();
      const camera   = new THREE.PerspectiveCamera(55, W / H, 0.1, 1000);
      camera.position.set(0, 0, 18);
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
      renderer.setSize(W, H);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));

      /* Concentric broadcast rings that pulse outward */
      const rings = [];
      [3, 6, 9, 12, 15].forEach((r, i) => {
        const mesh = new THREE.Mesh(
          new THREE.TorusGeometry(r, 0.018, 6, 100),
          new THREE.MeshBasicMaterial({ color: 0xf97316, transparent: true, opacity: 0.03 - i * 0.004 })
        );
        mesh.rotation.x = Math.PI / 2;
        mesh._baseR  = r;
        mesh._phase  = i * 0.7;
        scene.add(mesh);
        rings.push(mesh);
      });

      /* Sine wave lines (broadcast waveform) */
      const waveMat = new THREE.LineBasicMaterial({ color: 0xdc2626, transparent: true, opacity: 0.035 });
      [-5, 0, 5].forEach(yOff => {
        const wpts = [];
        for (let x = -20; x <= 20; x += 0.15) {
          wpts.push(new THREE.Vector3(x, Math.sin(x * 0.55) * 1.6 + yOff, 0));
        }
        scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(wpts), waveMat));
      });

      /* Floating signal dots */
      const COUNT = 80;
      const sPos  = new Float32Array(COUNT * 3);
      const sVel  = new Float32Array(COUNT * 2); // vx, vy
      for (let i = 0; i < COUNT; i++) {
        const ang = Math.random() * Math.PI * 2;
        const r   = 2 + Math.random() * 14;
        sPos[i * 3]     = Math.cos(ang) * r;
        sPos[i * 3 + 1] = Math.sin(ang) * r;
        sPos[i * 3 + 2] = (Math.random() - 0.5) * 8 - 4;
        sVel[i * 2]     = (Math.random() - 0.5) * 0.018;
        sVel[i * 2 + 1] = (Math.random() - 0.5) * 0.012;
      }
      const sGeo = new THREE.BufferGeometry();
      sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
      scene.add(new THREE.Points(sGeo,
        new THREE.PointsMaterial({ color: 0xf97316, size: 0.065, transparent: true, opacity: 0.4 })
      ));

      /* Central broadcast orb */
      const orb = new THREE.Mesh(
        new THREE.SphereGeometry(0.22, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0xf97316, transparent: true, opacity: 0.35 })
      );
      scene.add(orb);

      let t = 0, mx = 0, my = 0, sx = 0, sy = 0;
      document.addEventListener('mousemove', e => {
        mx = (e.clientX / W - 0.5) * 0.18;
        my = (e.clientY / H - 0.5) * -0.12;
      });

      const sPosArr = sGeo.attributes.position.array;

      (function tick() {
        requestAnimationFrame(tick); t += 0.016;

        /* Rings pulse scale + opacity */
        rings.forEach((ring, i) => {
          const pulse = 0.5 + 0.5 * Math.sin(t * 0.9 - ring._phase);
          ring.material.opacity = (0.03 - i * 0.004) * pulse;
          ring.scale.setScalar(1 + pulse * 0.04);
        });

        /* Orb pulse */
        const orbPulse = 0.8 + 0.2 * Math.sin(t * 1.5);
        orb.scale.setScalar(orbPulse);
        orb.material.opacity = 0.22 + 0.18 * Math.sin(t * 1.5);

        /* Move signal dots outward from origin */
        for (let i = 0; i < COUNT; i++) {
          sPosArr[i * 3]     += sVel[i * 2];
          sPosArr[i * 3 + 1] += sVel[i * 2 + 1];
          const dist = Math.sqrt(sPosArr[i*3]**2 + sPosArr[i*3+1]**2);
          if (dist > 17) {
            const ang = Math.random() * Math.PI * 2;
            sPosArr[i*3]     = Math.cos(ang) * (0.5 + Math.random() * 2);
            sPosArr[i*3+1]   = Math.sin(ang) * (0.5 + Math.random() * 2);
            sVel[i*2]   = Math.cos(ang) * (0.01 + Math.random() * 0.016);
            sVel[i*2+1] = Math.sin(ang) * (0.01 + Math.random() * 0.016);
          }
        }
        sGeo.attributes.position.needsUpdate = true;

        sx += (mx - sx) * 0.04; sy += (my - sy) * 0.04;
        scene.rotation.y = sx; scene.rotation.x = sy;

        renderer.render(scene, camera);
      })();

      window.addEventListener('resize', () => {
        const nw = window.innerWidth, nh = window.innerHeight;
        camera.aspect = nw / nh; camera.updateProjectionMatrix();
        renderer.setSize(nw, nh);
      });
    })();

    /* ─ Board content observer ─ */
    const boardObs = new MutationObserver(() => {
      const board = document.getElementById('board-content');
      if (!board || board.querySelector('.spinner-border')) return;

      /* Tag Instagram post items */
      board.querySelectorAll('[class*="card-body"] .p-3.border.rounded.mb-3').forEach((el, i) => {
        const parentCard = el.closest('.card');
        const isIg = parentCard?.querySelector('.fa-instagram');
        if (isIg) el.classList.add('post-item');
        else       el.classList.add('ad-item');
      });

      /* Tag slogan items */
      board.querySelectorAll('.col-md-4 .d-flex.align-items-center').forEach(el => {
        el.closest('.col-md-4')?.classList.add('slogan-item');
      });

      /* Tag social caption cards */
      board.querySelectorAll('.row.g-3 > .col-md-4').forEach(el => el.classList.add('social-card-wrap'));

      /* Card hover tilt */
      board.querySelectorAll('.card').forEach(card => {
        card.addEventListener('mousemove', e => {
          const r = card.getBoundingClientRect();
          const x = (e.clientX - r.left) / r.width  - 0.5;
          const y = (e.clientY - r.top)  / r.height - 0.5;
          card.style.transform = `perspective(700px) rotateX(${-y * 8}deg) rotateY(${x * 8}deg) translateZ(8px)`;
          card.style.boxShadow = `${-x * 20}px ${-y * 20}px 40px rgba(249,115,22,0.12)`;
        });
        card.addEventListener('mouseleave', () => {
          card.style.transform = ''; card.style.boxShadow = '';
        });
      });

      /* Copy button ripple effect */
      board.querySelectorAll('.btn-outline-secondary').forEach(btn => {
        btn.addEventListener('click', function (e) {
          const r = this.getBoundingClientRect();
          const ripple = document.createElement('span');
          ripple.className = 'copy-ripple';
          ripple.style.left = (e.clientX - r.left - 3) + 'px';
          ripple.style.top  = (e.clientY - r.top  - 3) + 'px';
          this.appendChild(ripple);
          ripple.addEventListener('animationend', () => ripple.remove());
        });
      });

      /* Particle burst on result arrival */
      const btn = document.getElementById('btn-submit');
      if (btn) {
        const r = btn.getBoundingClientRect();
        spawnBurst(r.left + r.width / 2, r.top + r.height / 2,
          ['#f97316', '#dc2626', '#f43f5e', '#fbbf24']);
      }
    });
    boardObs.observe(document.getElementById('board-content'), { childList: true });

    function spawnBurst(cx, cy, colors) {
      for (let i = 0; i < 16; i++) {
        const p = document.createElement('div');
        p.className = 'burst-particle';
        const angle = (i / 16) * Math.PI * 2;
        const dist  = 55 + Math.random() * 50;
        p.style.cssText = `left:${cx}px;top:${cy}px;background:${colors[i % colors.length]}`;
        p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        document.body.appendChild(p);
        p.addEventListener('animationend', () => p.remove());
      }
    }

    /* ─ Button sparkle on click ─ */
    document.getElementById('btn-submit')?.addEventListener('click', function () {
      const r = this.getBoundingClientRect();
      spawnBurst(r.left + r.width / 2, r.top + r.height / 2,
        ['#f97316', '#dc2626', '#ffffff', '#fbbf24']);
    });
  </script>
