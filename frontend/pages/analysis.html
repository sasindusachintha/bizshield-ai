<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>/* apply stored theme early to avoid FOUC */(function(){try{var t=localStorage.getItem('BizShield-theme');if(t==='dark'||t==='light'){document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;}}catch(e){} })();</script>
  <style>/* critical background to prevent white flash before CSS loads */
    html[data-theme="dark"]{background:#101923;color-scheme:dark}
    html[data-theme="light"]{background:#edf4ef;color-scheme:light}
  </style>
  <title>BizShield – Business Analysis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js" defer></script>

  <style>
    /* ═══════════════════════════════════════════════
       ANALYSIS PAGE — 3D ANIMATION LAYER
       Theme: Scanning radar / data grid
    ═══════════════════════════════════════════════ */

    /* ── Scroll progress ── */
    .scroll-progress {
      position: fixed; top: 0; left: 0; height: 3px;
      background: linear-gradient(90deg, #38bdf8, #2563eb);
      z-index: 9997; width: 0%;
      box-shadow: 0 0 8px rgba(56,189,248,0.7);
      transition: width 0.1s linear;
    }

    /* ── Three.js radar background ── */
    #bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none; width: 100%; height: 100%;
    }

    /* ── Ambient orbs ── */
    .bg-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg-orb { position: absolute; border-radius: 50%; filter: blur(90px); }
    .bg-orb-1 { width: 480px; height: 480px; background: radial-gradient(circle, rgba(37,99,235,1), transparent 70%); top: -180px; right: -120px; opacity: 0.055; animation: orbDrift 24s ease-in-out infinite; }
    .bg-orb-2 { width: 360px; height: 360px; background: radial-gradient(circle, rgba(56,189,248,1), transparent 70%); bottom: 10%; left: -100px; opacity: 0.04; animation: orbDrift 18s ease-in-out infinite reverse 5s; }
    .bg-orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(15,118,110,1), transparent 70%); top: 40%; right: 5%; opacity: 0.038; animation: orbDrift 22s ease-in-out infinite 8s; }
    @keyframes orbDrift {
      0%,100% { transform: translate(0,0) scale(1); }
      33%      { transform: translate(40px,-30px) scale(1.08); }
      66%      { transform: translate(-28px,44px) scale(0.94); }
    }

    /* Everything above bg */
    .container, nav { position: relative; z-index: 2; }

    /* ── Navbar entrance ── */
    .navbar-brand { animation: brandPop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.1s both; }
    @keyframes brandPop {
      from { opacity:0; transform:perspective(400px) translateZ(-30px) scale(0.85); }
      to   { opacity:1; transform:none; }
    }
    .navbar-nav .nav-item { animation: navDrop 0.45s cubic-bezier(0.16,1,0.3,1) both; }
    .navbar-nav .nav-item:nth-child(1){animation-delay:.18s}
    .navbar-nav .nav-item:nth-child(2){animation-delay:.24s}
    .navbar-nav .nav-item:nth-child(3){animation-delay:.30s}
    .navbar-nav .nav-item:nth-child(4){animation-delay:.36s}
    .navbar-nav .nav-item:nth-child(5){animation-delay:.42s}
    @keyframes navDrop {
      from { opacity:0; transform:translateY(-10px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── Page header 3D entrance ── */
    .page-header {
      animation: headerDive 0.75s cubic-bezier(0.16,1,0.3,1) 0.15s both;
    }
    @keyframes headerDive {
      from { opacity:0; transform:perspective(800px) translateZ(-60px) translateY(22px) rotateX(-14deg); filter:blur(4px); }
      to   { opacity:1; transform:none; filter:blur(0); }
    }
    .page-header h2 span {
      display: inline-block;
      animation: iconSpin3D 0.8s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
    }
    @keyframes iconSpin3D {
      from { transform:perspective(300px) rotateY(-180deg) scale(0.4); opacity:0; }
      to   { transform:none; opacity:1; }
    }

    /* ── Input card entrance ── */
    .input-card {
      animation: cardSlideIn 0.65s cubic-bezier(0.16,1,0.3,1) 0.28s both;
      position: relative; overflow: hidden;
    }
    .input-card::before {
      content:''; position:absolute; top:0; left:-100%; width:60%; height:100%;
      background:linear-gradient(90deg,transparent,rgba(56,189,248,0.04),transparent);
      transform:skewX(-20deg); animation:inputShimmer 3s ease 1s 1 forwards;
    }
    @keyframes inputShimmer { to { left:160%; } }
    @keyframes cardSlideIn {
      from { opacity:0; transform:perspective(700px) translateY(30px) rotateX(-10deg) scale(0.97); }
      to   { opacity:1; transform:none; }
    }

    /* ── Textarea focus glow ── */
    #input-idea {
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
    }
    #input-idea:focus {
      border-color: #38bdf8 !important;
      box-shadow: 0 0 0 3px rgba(56,189,248,0.15), 0 0 20px rgba(56,189,248,0.1) !important;
      transform: perspective(600px) translateZ(4px);
    }

    /* ── Submit button ── */
    #btn-submit {
      transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s ease;
      position: relative; overflow: hidden;
    }
    #btn-submit::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);
      background-size:200% 100%; transform:translateX(-100%);
      transition:transform 0.4s ease;
    }
    #btn-submit:hover:not(:disabled)::after { transform:translateX(100%); }
    #btn-submit:hover:not(:disabled) {
      transform:perspective(400px) translateZ(8px) scale(1.04);
      box-shadow:0 12px 30px rgba(56,189,248,0.3);
    }
    #btn-submit:active { transform:scale(0.97); }

    /* ── Board content reveal ── */
    .result-reveal { animation: resultIn 0.65s cubic-bezier(0.16,1,0.3,1) both; }
    @keyframes resultIn {
      from { opacity:0; transform:perspective(700px) translateY(24px) rotateX(-8deg); }
      to   { opacity:1; transform:none; }
    }

    /* ── Result cards stagger ── */
    #board-content .col-md-6:nth-child(1) .card { animation: cardIn3D 0.55s cubic-bezier(0.16,1,0.3,1) 0.05s both; }
    #board-content .col-md-6:nth-child(2) .card { animation: cardIn3D 0.55s cubic-bezier(0.16,1,0.3,1) 0.14s both; }
    #board-content .col-md-6:nth-child(3) .card { animation: cardIn3D 0.55s cubic-bezier(0.16,1,0.3,1) 0.23s both; }
    #board-content .col-md-6:nth-child(4) .card { animation: cardIn3D 0.55s cubic-bezier(0.16,1,0.3,1) 0.32s both; }
    @keyframes cardIn3D {
      from { opacity:0; transform:perspective(600px) translateY(20px) rotateX(-12deg) scale(0.95); }
      to   { opacity:1; transform:none; }
    }

    /* ── Result card hover tilt ── */
    #board-content .card {
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      will-change: transform;
    }

    /* ── Progress bar animated fill ── */
    .progress-bar { transition: width 1.2s cubic-bezier(0.25,1,0.5,1) !important; }

    /* ── Score number bounce ── */
    .display-5 { animation: numBounce 0.6s cubic-bezier(0.34,1.56,0.64,1) both; }
    @keyframes numBounce {
      from { transform:perspective(300px) translateZ(-30px) scale(0.5); opacity:0; }
      to   { transform:none; opacity:1; }
    }

    /* ── Badge pop ── */
    .badge { animation: badgePop 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }
    @keyframes badgePop {
      from { transform:scale(0.4); opacity:0; }
      to   { transform:scale(1); opacity:1; }
    }

    /* ── Risk list items slide ── */
    #board-content .list-unstyled li {
      animation: liSlide 0.35s ease both;
    }
    @keyframes liSlide {
      from { opacity:0; transform:translateX(-12px); }
      to   { opacity:1; transform:translateX(0); }
    }

    /* Stagger risk items */
    #board-content .list-unstyled li:nth-child(1){animation-delay:.35s}
    #board-content .list-unstyled li:nth-child(2){animation-delay:.42s}
    #board-content .list-unstyled li:nth-child(3){animation-delay:.49s}
    #board-content .list-unstyled li:nth-child(4){animation-delay:.56s}

    /* ── Scanning line on result h5 ── */
    #board-content h5 {
      position: relative;
      animation: resultIn 0.5s ease both;
    }
    #board-content h5::after {
      content:''; position:absolute; bottom:-4px; left:0;
      height:2px; width:0;
      background:linear-gradient(90deg, #38bdf8, transparent);
      animation:scanLine 0.8s ease 0.4s forwards;
    }
    @keyframes scanLine { to { width:100%; } }

    /* ── Alert slide up ── */
    #board-content .alert {
      animation: alertUp 0.5s cubic-bezier(0.16,1,0.3,1) 0.5s both;
    }
    @keyframes alertUp {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }

    /* ── Particle burst ── */
    .burst-particle {
      position:fixed; width:5px; height:5px; border-radius:50%;
      pointer-events:none; z-index:9990;
      animation:burst 0.65s ease-out forwards;
    }
    @keyframes burst {
      to { transform:translate(var(--tx),var(--ty)) scale(0); opacity:0; }
    }
  </style>
</head>
<body class="bg-dark text-light min-vh-100">

  <div class="scroll-progress" id="scroll-progress"></div>
  <canvas id="bg-canvas"></canvas>
  <div class="bg-orbs" aria-hidden="true">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
  </div>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary px-3 py-2">
    <a class="navbar-brand fw-bold fs-5" href="../index.html"><i class="fas fa-bolt me-1"></i>BizShield</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link" href="ideas.html"><i class="fas fa-lightbulb me-1"></i>Ideas</a></li>
        <li class="nav-item"><a class="nav-link active fw-semibold" href="analysis.html"><i class="fas fa-chart-bar me-1"></i>Analysis</a></li>
        <li class="nav-item"><a class="nav-link" href="plan.html"><i class="fas fa-map me-1"></i>Plan</a></li>
        <li class="nav-item"><a class="nav-link" href="marketing.html"><i class="fas fa-bullhorn me-1"></i>Marketing</a></li>
      </ul>
    </div>
  </nav>

  <div class="container py-4">

    <div class="mb-4 page-header">
      <h2 class="fw-bold"><span><i class="fas fa-chart-bar text-info me-2"></i></span>Business Analysis</h2>
      <p class="text-muted">Enter a business idea to get demand score, competition level, risk profile, and cost estimate.</p>
    </div>

    <div class="card bg-dark border-secondary mb-4 input-card">
      <div class="card-body p-4">
        <label class="form-label fw-semibold">Business Idea <span class="text-danger">*</span></label>
        <textarea id="input-idea" class="form-control bg-dark text-light border-secondary" rows="3"
          placeholder="e.g. A subscription box for local artisan coffee beans targeting remote workers..."></textarea>
        <div class="mt-3">
          <button id="btn-submit" class="btn btn-info text-dark px-4 fw-semibold">
            <i class="fas fa-search me-2"></i>Analyse Idea
          </button>
        </div>
      </div>
    </div>

    <div id="board-content"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/analysis.js"></script>

  <script>
    /* ─ Scroll progress ─ */
    window.addEventListener('scroll', () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      document.getElementById('scroll-progress').style.width = (max > 0 ? window.scrollY/max*100 : 0) + '%';
    });

    /* ─ Three.js: radar grid + scanning ring ─ */
    (function() {
      const canvas = document.getElementById('bg-canvas');
      if (!canvas || typeof THREE === 'undefined') return;
      const W = window.innerWidth, H = window.innerHeight;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(55, W/H, 0.1, 1000);
      camera.position.set(0, 0, 18);
      const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:false });
      renderer.setSize(W, H);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));

      /* Grid of dots */
      const dotCount = 120;
      const dotPos = new Float32Array(dotCount * 3);
      for (let i = 0; i < dotCount; i++) {
        dotPos[i*3]   = (Math.random()-0.5)*38;
        dotPos[i*3+1] = (Math.random()-0.5)*28;
        dotPos[i*3+2] = (Math.random()-0.5)*8 - 4;
      }
      const dotGeo = new THREE.BufferGeometry();
      dotGeo.setAttribute('position', new THREE.BufferAttribute(dotPos, 3));
      scene.add(new THREE.Points(dotGeo,
        new THREE.PointsMaterial({ color:0x38bdf8, size:0.055, transparent:true, opacity:0.35 })
      ));

      /* Horizontal scan plane (thin flat box that moves up-down) */
      const scanMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(40, 0.08),
        new THREE.MeshBasicMaterial({ color:0x38bdf8, transparent:true, opacity:0.07, side:THREE.DoubleSide })
      );
      scene.add(scanMesh);

      /* Wireframe torus for depth */
      const torus = new THREE.Mesh(
        new THREE.TorusGeometry(9, 0.018, 6, 120),
        new THREE.MeshBasicMaterial({ color:0x2563eb, transparent:true, opacity:0.03 })
      );
      torus.rotation.x = Math.PI/3;
      scene.add(torus);

      /* Concentric rings */
      [5,8,11].forEach((r,i) => {
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(r, 0.012, 6, 90),
          new THREE.MeshBasicMaterial({ color:0x38bdf8, transparent:true, opacity:0.025 - i*0.005 })
        );
        ring.rotation.x = Math.PI/2;
        scene.add(ring);
      });

      let t = 0, mx = 0, my = 0, sx = 0, sy = 0;
      document.addEventListener('mousemove', e => {
        mx = (e.clientX/W - 0.5) * 0.18;
        my = (e.clientY/H - 0.5) * -0.12;
      });

      (function tick() {
        requestAnimationFrame(tick); t += 0.016;
        /* Scan line oscillates vertically */
        scanMesh.position.y = Math.sin(t * 0.6) * 12;
        scanMesh.material.opacity = 0.04 + Math.abs(Math.sin(t * 0.6)) * 0.06;
        torus.rotation.z += 0.002;
        sx += (mx-sx)*0.04; sy += (my-sy)*0.04;
        scene.rotation.y = sx; scene.rotation.x = sy;
        renderer.render(scene, camera);
      })();

      window.addEventListener('resize', () => {
        const nw = window.innerWidth, nh = window.innerHeight;
        camera.aspect = nw/nh; camera.updateProjectionMatrix();
        renderer.setSize(nw, nh);
      });
    })();

    /* ─ Result cards 3D hover tilt ─ */
    const boardObs = new MutationObserver(() => {
      const board = document.getElementById('board-content');
      if (!board || board.querySelector('.spinner-border')) return;

      /* Animate progress bars */
      board.querySelectorAll('.progress-bar').forEach(bar => {
        const w = bar.style.width;
        bar.style.transition = 'none'; bar.style.width = '0'; bar.offsetWidth;
        bar.style.transition = ''; bar.style.width = w;
      });

      /* Apply tilt to result cards */
      board.querySelectorAll('.card').forEach(card => {
        card.addEventListener('mousemove', e => {
          const r = card.getBoundingClientRect();
          const x = (e.clientX-r.left)/r.width  - 0.5;
          const y = (e.clientY-r.top) /r.height - 0.5;
          card.style.transform = `perspective(700px) rotateX(${-y*8}deg) rotateY(${x*8}deg) translateZ(8px)`;
          card.style.boxShadow = `${-x*20}px ${-y*20}px 40px rgba(56,189,248,0.12)`;
        });
        card.addEventListener('mouseleave', () => { card.style.transform=''; card.style.boxShadow=''; });
      });

      /* Particle burst */
      const btn = document.getElementById('btn-submit');
      if (btn) {
        const r = btn.getBoundingClientRect();
        spawnBurst(r.left + r.width/2, r.top + r.height/2, ['#38bdf8','#2563eb','#0f766e','#f59e0b']);
      }
    });
    boardObs.observe(document.getElementById('board-content'), { childList:true });

    function spawnBurst(cx, cy, colors) {
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'burst-particle';
        const angle = (i/12)*Math.PI*2;
        const dist  = 50 + Math.random()*40;
        p.style.cssText = `left:${cx}px;top:${cy}px;background:${colors[i%colors.length]}`;
        p.style.setProperty('--tx', Math.cos(angle)*dist+'px');
        p.style.setProperty('--ty', Math.sin(angle)*dist+'px');
        document.body.appendChild(p);
        p.addEventListener('animationend', () => p.remove());
      }
    }

    /* ─ Button sparkle on click ─ */
    document.getElementById('btn-submit')?.addEventListener('click', function() {
      const r = this.getBoundingClientRect();
      spawnBurst(r.left+r.width/2, r.top+r.height/2, ['#38bdf8','#2563eb','#ffffff']);
    });
  </script>
</body>
</html>
