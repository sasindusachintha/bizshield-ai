<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exito – Generate Ideas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/theme.js" defer></script>

  <style>
    /* ═══════════════════════════════════════════════
       IDEAS PAGE — 3D ANIMATION LAYER
       Theme: Constellation of ideas / neural sparks
    ═══════════════════════════════════════════════ */

    .scroll-progress {
      position:fixed; top:0; left:0; height:3px;
      background:linear-gradient(90deg,#f59e0b,#f97316);
      z-index:9997; width:0%;
      box-shadow:0 0 8px rgba(245,158,11,0.7);
      transition:width 0.1s linear;
    }

    #bg-canvas {
      position:fixed; inset:0; z-index:0;
      pointer-events:none; width:100%; height:100%;
    }

    .bg-orbs { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
    .bg-orb  { position:absolute; border-radius:50%; filter:blur(90px); }
    .bg-orb-1 { width:500px; height:500px; background:radial-gradient(circle,rgba(245,158,11,1),transparent 70%); top:-180px; left:-100px; opacity:0.05; animation:orbDrift 20s ease-in-out infinite; }
    .bg-orb-2 { width:380px; height:380px; background:radial-gradient(circle,rgba(249,115,22,1),transparent 70%); bottom:5%; right:-80px; opacity:0.045; animation:orbDrift 26s ease-in-out infinite reverse 4s; }
    .bg-orb-3 { width:320px; height:320px; background:radial-gradient(circle,rgba(15,118,110,1),transparent 70%); top:38%; right:20%; opacity:0.038; animation:orbDrift 18s ease-in-out infinite 9s; }
    @keyframes orbDrift {
      0%,100%{transform:translate(0,0) scale(1);}
      33%{transform:translate(38px,-26px) scale(1.08);}
      66%{transform:translate(-24px,40px) scale(0.95);}
    }

    .container, nav { position:relative; z-index:2; }

    /* ── Navbar ── */
    .navbar-brand { animation:brandPop .6s cubic-bezier(.34,1.56,.64,1) .1s both; }
    @keyframes brandPop {
      from{opacity:0;transform:perspective(400px) translateZ(-30px) scale(.85);}
      to{opacity:1;transform:none;}
    }
    .navbar-nav .nav-item{animation:navDrop .45s cubic-bezier(.16,1,.3,1) both;}
    .navbar-nav .nav-item:nth-child(1){animation-delay:.18s}
    .navbar-nav .nav-item:nth-child(2){animation-delay:.24s}
    .navbar-nav .nav-item:nth-child(3){animation-delay:.30s}
    .navbar-nav .nav-item:nth-child(4){animation-delay:.36s}
    .navbar-nav .nav-item:nth-child(5){animation-delay:.42s}
    @keyframes navDrop{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

    /* ── Page header ── */
    .page-header { animation:headerDive .75s cubic-bezier(.16,1,.3,1) .15s both; }
    @keyframes headerDive {
      from{opacity:0;transform:perspective(800px) translateZ(-60px) translateY(22px) rotateX(-14deg);filter:blur(4px);}
      to{opacity:1;transform:none;filter:blur(0);}
    }
    /* Lightbulb flicker-on */
    .page-header .fa-lightbulb {
      animation:bulbFlicker .9s ease .4s both;
    }
    @keyframes bulbFlicker {
      0%{opacity:0;filter:brightness(0);}
      20%{opacity:.8;filter:brightness(2);}
      40%{opacity:.3;}
      60%{opacity:.9;filter:brightness(1.5);}
      80%{opacity:.6;}
      100%{opacity:1;filter:brightness(1);}
    }

    /* ── Input card ── */
    .input-card {
      animation:cardSlideIn .65s cubic-bezier(.16,1,.3,1) .28s both;
      position:relative; overflow:hidden;
    }
    .input-card::after {
      content:''; position:absolute; inset:0; border-radius:inherit;
      background:linear-gradient(135deg,rgba(245,158,11,.04),transparent 55%);
      opacity:0; transition:opacity .4s ease; pointer-events:none;
    }
    .input-card:hover::after { opacity:1; }
    @keyframes cardSlideIn {
      from{opacity:0;transform:perspective(700px) translateY(30px) rotateX(-10deg) scale(.97);}
      to{opacity:1;transform:none;}
    }

    /* ── Textarea focus ── */
    #input-skills, #input-interest {
      transition:border-color .3s ease, box-shadow .3s ease, transform .3s ease;
    }
    #input-skills:focus, #input-interest:focus {
      border-color:#f59e0b !important;
      box-shadow:0 0 0 3px rgba(245,158,11,.18), 0 0 20px rgba(245,158,11,.08) !important;
      transform:perspective(600px) translateZ(4px);
    }

    /* ── Submit button ── */
    #btn-submit {
      position:relative; overflow:hidden;
      transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease;
    }
    #btn-submit::before {
      content:''; position:absolute;
      top:50%; left:50%; width:0; height:0;
      background:rgba(255,255,255,.1);
      border-radius:50%;
      transform:translate(-50%,-50%);
      transition:width .4s ease, height .4s ease;
    }
    #btn-submit:hover:not(:disabled)::before { width:260px; height:260px; }
    #btn-submit:hover:not(:disabled) {
      transform:perspective(400px) translateZ(8px) scale(1.04);
      box-shadow:0 12px 30px rgba(245,158,11,.28);
    }
    #btn-submit:active { transform:scale(.97); }

    /* ── Result reveal ── */
    .result-reveal { animation:resultIn .65s cubic-bezier(.16,1,.3,1) both; }
    @keyframes resultIn {
      from{opacity:0;transform:perspective(700px) translateY(24px) rotateX(-8deg);}
      to{opacity:1;transform:none;}
    }

    /* ── Idea cards — 3D stagger entrance ── */
    #board-content .col-md-6:nth-child(1) .card{animation:ideaCardIn .55s cubic-bezier(.16,1,.3,1) .05s both;}
    #board-content .col-md-6:nth-child(2) .card{animation:ideaCardIn .55s cubic-bezier(.16,1,.3,1) .13s both;}
    #board-content .col-md-6:nth-child(3) .card{animation:ideaCardIn .55s cubic-bezier(.16,1,.3,1) .21s both;}
    #board-content .col-md-6:nth-child(4) .card{animation:ideaCardIn .55s cubic-bezier(.16,1,.3,1) .29s both;}
    #board-content .col-md-6:nth-child(5) .card{animation:ideaCardIn .55s cubic-bezier(.16,1,.3,1) .37s both;}
    /* Also target col-lg-4 grids */
    #board-content .col-lg-4:nth-child(1) .card{animation:ideaCardIn .55s cubic-bezier(.16,1,.3,1) .05s both;}
    #board-content .col-lg-4:nth-child(2) .card{animation:ideaCardIn .55s cubic-bezier(.16,1,.3,1) .13s both;}
    #board-content .col-lg-4:nth-child(3) .card{animation:ideaCardIn .55s cubic-bezier(.16,1,.3,1) .21s both;}
    #board-content .col-lg-4:nth-child(4) .card{animation:ideaCardIn .55s cubic-bezier(.16,1,.3,1) .29s both;}
    #board-content .col-lg-4:nth-child(5) .card{animation:ideaCardIn .55s cubic-bezier(.16,1,.3,1) .37s both;}
    @keyframes ideaCardIn {
      from{opacity:0;transform:perspective(600px) rotateY(-25deg) translateX(-20px) scale(.9);}
      to{opacity:1;transform:none;}
    }

    /* ── Idea card hover ── */
    #board-content .card {
      transition:transform .15s ease, box-shadow .15s ease;
      will-change:transform;
      position:relative; overflow:hidden;
    }
    #board-content .card::before {
      content:''; position:absolute; top:0; left:-100%; width:55%; height:100%;
      background:linear-gradient(90deg,transparent,rgba(245,158,11,.05),transparent);
      transform:skewX(-20deg); pointer-events:none;
      transition:left .5s ease;
    }
    #board-content .card:hover::before { left:160%; }

    /* ── Badge number pop ── */
    #board-content .badge { animation:badgePop .4s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes badgePop {
      from{transform:scale(.4);opacity:0;}
      to{transform:scale(1);opacity:1;}
    }

    /* ── Analyse btn in card footer ── */
    #board-content .btn-outline-primary {
      transition:transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease;
    }
    #board-content .btn-outline-primary:hover {
      transform:perspective(300px) translateZ(6px) scale(1.05);
      box-shadow:0 6px 18px rgba(15,118,110,.22);
    }

    /* ── Particle burst ── */
    .burst-particle{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:9990;animation:burst .65s ease-out forwards;}
    @keyframes burst{to{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0;}}
  </style>
</head>
<body class="bg-dark text-light min-vh-100">

  <div class="scroll-progress" id="scroll-progress"></div>
  <canvas id="bg-canvas"></canvas>
  <div class="bg-orbs" aria-hidden="true">
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
  </div>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary px-3 py-2">
    <a class="navbar-brand fw-bold fs-5" href="../index.html"><i class="fas fa-bolt me-1"></i>Exito</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto gap-1">
        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-tachometer-alt me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active fw-semibold" href="ideas.html"><i class="fas fa-lightbulb me-1"></i>Ideas</a></li>
        <li class="nav-item"><a class="nav-link" href="analysis.html"><i class="fas fa-chart-bar me-1"></i>Analysis</a></li>
        <li class="nav-item"><a class="nav-link" href="plan.html"><i class="fas fa-map me-1"></i>Plan</a></li>
        <li class="nav-item"><a class="nav-link" href="marketing.html"><i class="fas fa-bullhorn me-1"></i>Marketing</a></li>
      </ul>
    </div>
  </nav>

  <div class="container py-4">

    <div class="mb-4 page-header">
      <h2 class="fw-bold"><i class="fas fa-lightbulb text-warning me-2"></i>Generate Business Ideas</h2>
      <p class="text-muted">Tell us about your skills and interests — we'll generate 5 tailored startup ideas.</p>
    </div>

    <div class="card bg-dark border-secondary mb-4 input-card">
      <div class="card-body p-4">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Your Skills <span class="text-danger">*</span></label>
            <textarea id="input-skills" class="form-control bg-dark text-light border-secondary" rows="3"
              placeholder="e.g. Web development, graphic design, copywriting, finance..."></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Interest / Niche <span class="text-danger">*</span></label>
            <textarea id="input-interest" class="form-control bg-dark text-light border-secondary" rows="3"
              placeholder="e.g. Health &amp; wellness, SaaS tools, e-commerce, education..."></textarea>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Available Budget <span class="text-muted">(optional)</span></label>
            <div class="input-group">
              <span class="input-group-text bg-dark text-muted border-secondary">$</span>
              <input id="input-budget" type="number" min="0"
                class="form-control bg-dark text-light border-secondary" placeholder="e.g. 500">
            </div>
            <small class="text-muted">Leave blank if unknown</small>
          </div>
        </div>
        <div class="mt-4">
          <button id="btn-submit" class="btn btn-primary px-4">
            <i class="fas fa-magic me-2"></i>Generate Ideas
          </button>
        </div>
      </div>
    </div>

    <div id="board-content"></div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ideas.js"></script>

  <script>
    /* ─ Scroll progress ─ */
    window.addEventListener('scroll', () => {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      document.getElementById('scroll-progress').style.width = (max>0?window.scrollY/max*100:0)+'%';
    });

    /* ─ Three.js: neural constellation ─ */
    (function() {
      const canvas = document.getElementById('bg-canvas');
      if (!canvas || typeof THREE === 'undefined') return;
      const W = window.innerWidth, H = window.innerHeight;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(55, W/H, 0.1, 1000);
      camera.position.z = 20;
      const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:false });
      renderer.setSize(W, H);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));

      /* Node particles */
      const N = 90;
      const nPos = new Float32Array(N*3);
      const nVel = new Float32Array(N*3);
      for (let i=0;i<N;i++) {
        nPos[i*3]   = (Math.random()-.5)*42;
        nPos[i*3+1] = (Math.random()-.5)*30;
        nPos[i*3+2] = (Math.random()-.5)*10-4;
        nVel[i*3]   = (Math.random()-.5)*0.012;
        nVel[i*3+1] = (Math.random()-.5)*0.009;
        nVel[i*3+2] = (Math.random()-.5)*0.005;
      }
      const nGeo = new THREE.BufferGeometry();
      const nAttr = new THREE.BufferAttribute(nPos, 3);
      nAttr.setUsage(THREE.DynamicDrawUsage);
      nGeo.setAttribute('position', nAttr);
      scene.add(new THREE.Points(nGeo,
        new THREE.PointsMaterial({ color:0xf59e0b, size:0.1, transparent:true, opacity:0.5 })
      ));

      /* Connection lines */
      const MAX_L = 2000;
      const lBuf = new Float32Array(MAX_L*6);
      const lGeo = new THREE.BufferGeometry();
      const lAttr = new THREE.BufferAttribute(lBuf, 3);
      lAttr.setUsage(THREE.DynamicDrawUsage);
      lGeo.setAttribute('position', lAttr);
      scene.add(new THREE.LineSegments(lGeo,
        new THREE.LineBasicMaterial({ color:0xf97316, transparent:true, opacity:0.08 })
      ));
      const THRESH = 7*7;

      /* Pulsing center sphere (idea nucleus) */
      const nucleus = new THREE.Mesh(
        new THREE.SphereGeometry(1.4, 8, 6),
        new THREE.MeshBasicMaterial({ color:0xf59e0b, wireframe:true, transparent:true, opacity:0.08 })
      );
      scene.add(nucleus);

      let t=0, mx=0, my=0, sx=0, sy=0;
      document.addEventListener('mousemove', e => {
        mx=(e.clientX/W-.5)*0.22; my=(e.clientY/H-.5)*-0.14;
      });

      (function tick() {
        requestAnimationFrame(tick); t+=0.015;
        /* Move nodes */
        for (let i=0;i<N;i++) {
          nPos[i*3]  +=nVel[i*3];  nPos[i*3+1]+=nVel[i*3+1]; nPos[i*3+2]+=nVel[i*3+2];
          if (Math.abs(nPos[i*3])>21)  nVel[i*3]*=-1;
          if (Math.abs(nPos[i*3+1])>15) nVel[i*3+1]*=-1;
          if (Math.abs(nPos[i*3+2])>5)  nVel[i*3+2]*=-1;
        }
        nAttr.needsUpdate=true;
        /* Lines */
        let lc=0;
        outer: for (let i=0;i<N;i++) for (let j=i+1;j<N;j++) {
          if (lc>=MAX_L*2) break outer;
          const dx=nPos[i*3]-nPos[j*3], dy=nPos[i*3+1]-nPos[j*3+1], dz=nPos[i*3+2]-nPos[j*3+2];
          if (dx*dx+dy*dy+dz*dz<THRESH) {
            lBuf[lc*3]=nPos[i*3];lBuf[lc*3+1]=nPos[i*3+1];lBuf[lc*3+2]=nPos[i*3+2];lc++;
            lBuf[lc*3]=nPos[j*3];lBuf[lc*3+1]=nPos[j*3+1];lBuf[lc*3+2]=nPos[j*3+2];lc++;
          }
        }
        lAttr.needsUpdate=true; lGeo.setDrawRange(0,lc);
        /* Nucleus pulse */
        const s = 1+Math.sin(t*1.2)*0.06;
        nucleus.scale.setScalar(s);
        nucleus.rotation.y+=0.007; nucleus.rotation.x+=0.004;
        sx+=(mx-sx)*0.04; sy+=(my-sy)*0.04;
        scene.rotation.y=sx; scene.rotation.x=sy;
        renderer.render(scene, camera);
      })();

      window.addEventListener('resize', () => {
        const nw=window.innerWidth,nh=window.innerHeight;
        camera.aspect=nw/nh; camera.updateProjectionMatrix(); renderer.setSize(nw,nh);
      });
    })();

    /* ─ Result card tilt + board reveal ─ */
    const boardObs = new MutationObserver(() => {
      const board = document.getElementById('board-content');
      if (!board || board.querySelector('.spinner-border')) return;

      /* Tilt on idea cards */
      board.querySelectorAll('.card').forEach(card => {
        card.addEventListener('mousemove', e => {
          const r=card.getBoundingClientRect();
          const x=(e.clientX-r.left)/r.width-.5;
          const y=(e.clientY-r.top)/r.height-.5;
          card.style.transform=`perspective(700px) rotateX(${-y*9}deg) rotateY(${x*9}deg) translateZ(8px)`;
          card.style.boxShadow=`${-x*20}px ${-y*20}px 38px rgba(245,158,11,0.13)`;
        });
        card.addEventListener('mouseleave', ()=>{ card.style.transform=''; card.style.boxShadow=''; });
      });

      /* Burst on generate */
      const btn=document.getElementById('btn-submit');
      if (btn) { const r=btn.getBoundingClientRect(); spawnBurst(r.left+r.width/2,r.top+r.height/2); }
    });
    boardObs.observe(document.getElementById('board-content'), {childList:true});

    function spawnBurst(cx,cy) {
      const colors=['#f59e0b','#f97316','#fbbf24','#0f766e'];
      for (let i=0;i<16;i++) {
        const p=document.createElement('div');
        p.className='burst-particle';
        const angle=(i/16)*Math.PI*2, dist=60+Math.random()*50;
        p.style.cssText=`left:${cx}px;top:${cy}px;background:${colors[i%colors.length]}`;
        p.style.setProperty('--tx',Math.cos(angle)*dist+'px');
        p.style.setProperty('--ty',Math.sin(angle)*dist+'px');
        document.body.appendChild(p);
        p.addEventListener('animationend',()=>p.remove());
      }
    }

    document.getElementById('btn-submit')?.addEventListener('click', function() {
      const r=this.getBoundingClientRect();
      spawnBurst(r.left+r.width/2, r.top+r.height/2);
    });
  </script>
</body>
</html>
